# ═══════════════════════════════════════════════════════════════
# LOCAL PROFILE
# ═══════════════════════════════════════════════════════════════
spring:
  datasource:
    # Credenciales en backend/.env (ver .env.example)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    show-sql: true

  mail:
    host: localhost
    port: 1025




logging:
  level:
    com.aaasas.inmobiliaria: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

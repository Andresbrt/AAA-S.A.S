# PRODUCTION PROFILE
# ═══════════════════════════════════════════════════════════════
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    show-sql: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:mock}
    password: ${SMTP_PASSWORD:mock}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.aaasas.inmobiliaria: INFO
    org.hibernate.SQL: WARN

# ═══════════════════════════════════════════════════════════════
# APPLICATION BASE CONFIG
# ═══════════════════════════════════════════════════════════════
spring:
  application:
    name: inmobiliaria-api

  # ── Mail Configuration (SMTP) ───────────────────────────────
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:mock}
    password: ${SMTP_PASSWORD:mock}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Supabase Database ───────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.xvderakdvfvmnuczamla.supabase.co:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:***REMOVED***}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      connection-timeout: 30000

  # ── JPA ──────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ── Flyway ──────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ─────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ── Virtual Threads (Java 21) ───────────────────────────────
  threads:
    virtual:
      enabled: true

  # ── Cache ───────────────────────────────────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  # ── Servlet ─────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

# ═══════════════════════════════════════════════════════════════
# SERVER
# ═══════════════════════════════════════════════════════════════
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ═══════════════════════════════════════════════════════════════
# SPRINGDOC / SWAGGER
# ═══════════════════════════════════════════════════════════════
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ═══════════════════════════════════════════════════════════════
# ACTUATOR
# ═══════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ═══════════════════════════════════════════════════════════════
# APPLICATION CUSTOM PROPERTIES
# ═══════════════════════════════════════════════════════════════
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-must-be-changed-in-production-at-least-256-bits}
    access-token-expiration-ms: 900000       # 15 min
    refresh-token-expiration-ms: 604800000   # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  storage:
    provider: ${STORAGE_PROVIDER:supabase}

  # ── Supabase Storage ─────────────────────────────────────────
  supabase:
    url: ${SUPABASE_URL:https://xvderakdvfvmnuczamla.supabase.co}
    key: ${SUPABASE_KEY:***REMOVED***}
    bucket: ${SUPABASE_BUCKET:media}

  admin:
    email: ${ADMIN_EMAIL:andresbermu211@gmail.com}
    password: ${ADMIN_PASSWORD:***REMOVED***}
    name: ${ADMIN_NAME:Andres Bermudez}

  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    lead:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60

        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?prepareThreshold=0
      - key: DATABASE_USERNAME
        value: postgres.xvderakdvfvmnuczamla
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://aaa-s-a-s.onrender.com,http://localhost:3000
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: https://xvderakdvfvmnuczamla.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      - key: ADMIN_EMAIL
        value: andresbermu211@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Andres Bermudez
      - key: MFA_ENCRYPTION_KEY
        sync: false
